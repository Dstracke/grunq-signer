<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Grunq Signer – promo tile</title>
<style>
  @font-face {
    font-family: "Inter Tight";
    src: url("../src/fonts/InterTight-Variable.woff2") format("woff2");
    font-weight: 100 900;
    font-style: normal;
  }
  html, body { margin: 0; width: 440px; height: 280px; overflow: hidden; }
  body {
    background:
      radial-gradient(380px 200px at 88% -14%, rgba(61,139,255,.34), transparent 62%),
      radial-gradient(300px 180px at 0% 0%, rgba(255,61,129,.18), transparent 58%),
      #05070a;
    background-repeat: no-repeat;
    color: #f1f5fa;
    font-family: "Inter Tight", ui-sans-serif, system-ui, sans-serif;
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 0 28px;
    box-sizing: border-box;
  }
  img { width: 92px; height: 92px; border-radius: 20px; box-shadow: 0 0 44px -8px rgba(61,139,255,.85); }
  .t { min-width: 0; }
  h1 { margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -.01em; line-height: 1.1; }
  p { margin: 6px 0 0; font-size: 14px; color: #c3cfdd; line-height: 1.35; }
  .chip { display: inline-block; margin-top: 10px; padding: 2px 9px; border-radius: 999px;
          border: 1px solid rgba(184,255,74,.35); background: rgba(184,255,74,.12);
          color: #b8ff4a; font-size: 11px; }
</style>
</head>
<body>
  <img src="../src/icons/grunq-128.png" alt="">
  <div class="t">
    <h1>Grunq Signer</h1>
    <p>Nostr identity in your browser.<br>NIP-07 provider &amp; NIP-46 signer.</p>
    <span class="chip">Keys stay local</span>
  </div>
</body>
</html>

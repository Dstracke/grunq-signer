<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Grunq Signer</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <header>
    <img class="logo" src="../icons/grunq-32.png" alt="Grunq" width="28" height="28">
    <div class="titles">
      <h1>Grunq Signer</h1>
      <p id="identity-line" class="muted mono">…</p>
    </div>
  </header>

  <main>
    <p id="global-error" class="error" hidden></p>

    <section id="view-missing" class="card" hidden>
      <p class="hint" data-i18n="optionsNoIdentity"></p>
    </section>

    <section class="card" id="card-identities">
      <div class="card-head">
        <h2 data-i18n="identitiesHeading"></h2>
        <button id="btn-identity-add" class="mini" data-i18n="btnAddIdentity"></button>
      </div>
      <p class="hint" data-i18n="identitiesHint"></p>
      <ul id="identities" class="entries"></ul>
      <p id="no-identities" class="muted" data-i18n="identitiesNone"></p>
      <div id="identity-add-form" hidden>
        <label class="flabel" for="id-label" data-i18n="identityLabel"></label>
        <input id="id-label" class="field" type="text" autocomplete="off">
        <label class="flabel" for="id-secret" data-i18n="identitySecret"></label>
        <textarea id="id-secret" rows="2" spellcheck="false" data-i18n-placeholder="keyPlaceholder"></textarea>
        <input id="id-passphrase" class="field" type="password" autocomplete="off"
          data-i18n-placeholder="importPassphrasePlaceholder">
        <div class="row">
          <button id="btn-identity-save" class="primary" data-i18n="btnAddIdentitySave"></button>
          <button id="btn-identity-generate" data-i18n="btnGenerate"></button>
          <button id="btn-identity-cancel" data-i18n="btnCancel"></button>
        </div>
        <p id="identity-error" class="error" hidden></p>
      </div>

      <hr class="sep">
      <h3 data-i18n="backupIdentitiesHeading"></h3>
      <p class="hint" data-i18n="backupIdentitiesHint"></p>
      <div class="grid">
        <div>
          <label class="flabel" for="backup-password" data-i18n="backupPassphrase"></label>
          <input id="backup-password" class="field" type="password" autocomplete="new-password">
        </div>
        <div>
          <label class="flabel" for="backup-password2" data-i18n="backupPassphraseRepeat"></label>
          <input id="backup-password2" class="field" type="password" autocomplete="new-password">
        </div>
      </div>
      <div class="row">
        <button id="btn-backup-export" data-i18n="btnBackupExport"></button>
        <button id="btn-backup-import" data-i18n="btnBackupImport"></button>
        <input id="backup-file" type="file" accept=".json,application/json" hidden>
      </div>
      <p id="backup-status" class="hint" hidden></p>
      <p id="backup-error" class="error" hidden></p>
    </section>

    <section class="card" id="card-profile">
      <div class="card-head">
        <h2 data-i18n="profileHeading"></h2>
        <span id="profile-state" class="chip"></span>
      </div>
      <p class="hint" data-i18n="profilePublishHint"></p>
      <div class="grid">
        <label class="flabel" for="pf-name" data-i18n="profileName"></label>
        <input id="pf-name" class="field" type="text" spellcheck="false">
        <label class="flabel" for="pf-display-name" data-i18n="profileDisplayName"></label>
        <input id="pf-display-name" class="field" type="text" spellcheck="false">
        <label class="flabel" for="pf-picture" data-i18n="profilePicture"></label>
        <input id="pf-picture" class="field" type="url" spellcheck="false" placeholder="https://…">
        <label class="flabel" for="pf-banner" data-i18n="profileBanner"></label>
        <input id="pf-banner" class="field" type="url" spellcheck="false" placeholder="https://…">
        <label class="flabel" for="pf-website" data-i18n="profileWebsite"></label>
        <input id="pf-website" class="field" type="url" spellcheck="false" placeholder="https://…">
        <label class="flabel" for="pf-lud16" data-i18n="profileLud16"></label>
        <div class="with-btn">
          <input id="pf-lud16" class="field" type="text" spellcheck="false" placeholder="name@wallet">
          <button id="btn-check-lud16" class="mini" data-i18n="btnCheck"></button>
        </div>
      </div>

      <p id="lud16-result" class="hint check-result" hidden></p>

      <label class="flabel" for="pf-nip05" data-i18n="profileNip05"></label>
      <div class="with-btn">
        <input id="pf-nip05" class="field" type="text" spellcheck="false" placeholder="name@domain">
        <button id="btn-check-nip05" class="mini" data-i18n="btnCheck"></button>
      </div>
      <p id="nip05-result" class="hint check-result" hidden></p>

      <div class="row">
        <button id="btn-claim-nip05" data-i18n="btnClaimNip05"></button>
      </div>
      <div id="claim-box" hidden>
        <p id="claim-status" class="hint"></p>
        <textarea id="claim-text" class="mono" rows="7" readonly spellcheck="false"></textarea>
        <div class="row">
          <button id="btn-claim-mail" data-i18n="claimOpenMail"></button>
          <button id="btn-claim-copy" data-i18n="claimCopy"></button>
        </div>
      </div>
      <label class="flabel" for="pf-about" data-i18n="profileAbout"></label>
      <textarea id="pf-about" rows="3" spellcheck="false"></textarea>

      <label class="check">
        <input type="checkbox" id="pf-bot">
        <span data-i18n="profileBot"></span>
      </label>

      <h3 class="preview-heading" data-i18n="profilePreviewHeading"></h3>
      <div id="profile-preview" class="profile-preview">
        <div id="pp-banner" class="pp-banner"></div>
        <div class="pp-body">
          <img id="pp-avatar" class="pp-avatar" alt="">
          <div class="pp-info">
            <p class="pp-name"><strong id="pp-display"></strong>
              <span id="pp-name" class="muted mono"></span></p>
            <p class="pp-badges">
              <span id="pp-nip05" class="chip ok" hidden></span>
              <span id="pp-lud16" class="chip" hidden></span>
              <span id="pp-bot" class="chip pending" hidden></span>
            </p>
            <p id="pp-about" class="small"></p>
            <a id="pp-website" class="small" target="_blank" rel="noreferrer noopener" hidden></a>
          </div>
        </div>
      </div>

      <div class="row">
        <button id="btn-profile-publish" class="primary" data-i18n="btnPublishProfile"></button>
        <button id="btn-profile-fetch" data-i18n="btnFetchProfile"></button>
        <button id="btn-profile-check" data-i18n="btnProfileCheck"></button>
        <button id="btn-profile-delete" class="danger" data-i18n="btnDeleteProfile"></button>
      </div>
      <p id="profile-status" class="hint" hidden></p>
      <p id="profile-error" class="error" hidden></p>
    </section>

    <section class="card" id="card-relays">
      <h2 data-i18n="relaysHeading"></h2>
      <p class="hint" data-i18n="relaysHint"></p>
      <textarea id="relays-input" class="mono" rows="4" spellcheck="false"></textarea>
      <div class="row">
        <button id="btn-relays-save" class="primary" data-i18n="btnRelaysSave"></button>
      </div>
      <p id="relays-status" class="hint" hidden></p>
      <p id="relays-error" class="error" hidden></p>
    </section>

    <section class="card" id="card-pair">
      <h2 data-i18n="pairHeading"></h2>
      <p class="hint" data-i18n="pairHint"></p>
      <textarea id="pair-uri" class="mono" rows="2" spellcheck="false" placeholder="nostrconnect://…"></textarea>
      <div class="row">
        <button id="btn-pair" class="primary" data-i18n="btnPair"></button>
      </div>
      <p id="pair-status" class="hint" hidden></p>
      <p id="pair-error" class="error" hidden></p>
    </section>

    <section class="card" id="card-approvals">
      <h2 data-i18n="approvalsHeading"></h2>
      <p class="hint" data-i18n="approvalsOptionsHint"></p>
      <ul id="approvals" class="entries"></ul>
      <p id="no-approvals" class="muted" data-i18n="noApprovals"></p>
    </section>

    <section class="card" id="card-sessions">
      <h2 data-i18n="bunkerHeading"></h2>
      <ul id="sessions" class="entries"></ul>
      <p id="no-sessions" class="muted" data-i18n="noSessions"></p>
    </section>

    <section class="card" id="card-audit">
      <div class="card-head">
        <h2 data-i18n="auditHeading"></h2>
        <div class="toolbar">
          <select id="audit-filter" data-i18n-aria-label="auditFilterLabel"></select>
          <button id="btn-audit-refresh" class="mini" data-i18n="btnAuditRefresh"></button>
          <button id="btn-audit-clear" class="mini danger" data-i18n="btnAuditClear"></button>
        </div>
      </div>
      <p class="hint" data-i18n="auditHint"></p>
      <table class="audit">
        <thead>
          <tr>
            <th data-i18n="auditColTime"></th>
            <th data-i18n="auditColWho"></th>
            <th data-i18n="auditColMethod"></th>
            <th data-i18n="auditColResult"></th>
          </tr>
        </thead>
        <tbody id="audit-rows"></tbody>
      </table>
      <p id="audit-empty" class="muted" data-i18n="auditNone"></p>
    </section>

    <p class="hint footer" data-i18n="optionsHint"></p>
  </main>

  <script src="options.js"></script>
</body>
</html>

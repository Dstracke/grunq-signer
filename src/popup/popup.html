<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Grunq Signer</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img class="logo" src="../icons/grunq-32.png" alt="Grunq" width="26" height="26">
    <h1>Grunq Signer</h1>
    <button id="btn-options" class="mini" data-i18n="btnSettings"></button>
  </header>

  <main id="view-import" hidden>
    <p class="hint" data-i18n="popupSetupHint"></p>
    <textarea id="key-input" rows="3" spellcheck="false"
      data-i18n-placeholder="keyPlaceholder"></textarea>
    <input id="key-passphrase" class="field" type="password" autocomplete="off"
      data-i18n-placeholder="importPassphrasePlaceholder">
    <div class="row">
      <button id="btn-import" class="primary" data-i18n="btnImport"></button>
      <button id="btn-generate" data-i18n="btnGenerate"></button>
    </div>
    <p id="import-error" class="error" hidden></p>
  </main>

  <main id="view-identity" hidden>
    <section class="card">
      <div class="card-head">
        <h2 data-i18n="identityHeading"></h2>
        <span id="identity-label" class="chip" hidden></span>
      </div>
      <p id="npub" class="npub">…</p>
      <p id="pubkey-short" class="muted mono">…</p>
      <div class="row">
        <button id="btn-copy" data-i18n="btnCopy"></button>
        <button id="btn-qr" data-i18n="btnQr"></button>
      </div>
      <div class="row">
        <button id="btn-remove" class="danger" data-i18n="btnRemove"></button>
      </div>

      <div id="export-box" hidden>
        <h3 data-i18n="qrNpubHeading"></h3>
        <p class="hint" data-i18n="qrNpubHint"></p>
        <div class="qr-wrap">
          <img id="qr-npub" class="qr" alt="" data-i18n-alt="qrNpubHeading">
        </div>
        <p class="muted center" id="qr-empty" hidden data-i18n="qrRenderError"></p>

        <hr class="sep">

        <h3 class="danger-text" data-i18n="qrNsecHeading"></h3>
        <p class="hint warn" data-i18n="qrNsecWarn"></p>
        <div id="nsec-locked">
          <div class="row">
            <button id="btn-nsec-show" class="danger" data-i18n="btnShowNsec"></button>
          </div>
        </div>
        <div id="nsec-confirm" hidden>
          <p class="hint warn" data-i18n="qrNsecConfirm"></p>
          <div class="row">
            <button id="btn-nsec-confirm" class="danger" data-i18n="btnShowNsecConfirm"></button>
            <button id="btn-nsec-cancel" data-i18n="btnCancel"></button>
          </div>
        </div>
        <div id="nsec-unlocked" hidden>
          <p id="nsec" class="npub nsec">…</p>
          <div class="qr-wrap">
            <img id="qr-nsec" class="qr" alt="" data-i18n-alt="qrNsecHeading">
          </div>
          <p class="hint" data-i18n="qrNsecScanHint"></p>
          <div class="row">
            <button id="btn-nsec-copy" data-i18n="btnCopyNsec"></button>
            <button id="btn-nsec-hide" data-i18n="btnHide"></button>
          </div>
        </div>
        <p id="export-error" class="error" hidden></p>
      </div>
    </section>

    <section class="card">
      <h2 data-i18n="securityHeading"></h2>
      <p id="sec-state" class="hint"></p>

      <div id="sec-unlock" hidden>
        <input id="unlock-password" class="field" type="password" autocomplete="current-password"
          data-i18n-placeholder="unlockPassphrasePlaceholder">
        <div class="row">
          <button id="btn-unlock" class="primary" data-i18n="btnUnlock"></button>
        </div>
      </div>

      <div id="sec-passphrase">
        <p id="sec-passphrase-hint" class="hint" data-i18n="secProtectHint"></p>
        <input id="new-password" class="field" type="password" autocomplete="new-password"
          data-i18n-placeholder="newPassphrasePlaceholder">
        <input id="new-password-repeat" class="field" type="password" autocomplete="new-password"
          data-i18n-placeholder="repeatPassphrasePlaceholder">
        <div class="row">
          <button id="btn-protect" class="primary" data-i18n="btnProtect"></button>
        </div>
      </div>

      <div id="sec-options" hidden>
        <hr class="sep">
        <label class="check">
          <input type="checkbox" id="auto-lock">
          <span data-i18n="secAutoLock"></span>
        </label>
        <label class="check">
          <input type="number" id="idle-minutes" min="1" max="240" step="1">
          <span data-i18n="secIdleLabel"></span>
        </label>
        <div class="row">
          <button id="btn-security-save" data-i18n="btnSaveSecurity"></button>
          <button id="btn-lock" data-i18n="btnLockNow"></button>
        </div>
        <div class="row">
          <button id="btn-unprotect" class="danger" data-i18n="btnUnprotect"></button>
        </div>
        <p id="sec-saved" class="hint" hidden data-i18n="secSaved"></p>
      </div>

      <div id="backup-box" hidden>
        <hr class="sep">
        <h3 data-i18n="backupHeading"></h3>
        <p class="hint" data-i18n="backupHint"></p>
        <textarea id="backup-value" class="mono" rows="3" readonly spellcheck="false"></textarea>
        <div class="qr-wrap">
          <img id="qr-backup" class="qr" alt="" data-i18n-alt="backupHeading">
        </div>
        <div class="row">
          <button id="btn-backup-copy" data-i18n="btnCopyBackup"></button>
        </div>
      </div>

      <p id="sec-error" class="error" hidden></p>
    </section>

    <section class="card">
      <h2 data-i18n="approvalsHeading"></h2>
      <ul id="approvals" class="approvals"></ul>
      <p id="no-approvals" class="muted" data-i18n="noApprovals"></p>
    </section>

    <section class="card">
      <h2 data-i18n="bunkerHeading"></h2>
      <p class="hint" data-i18n="bunkerHint"></p>
      <div class="row">
        <button id="btn-invite" class="primary" data-i18n="btnInvite"></button>
      </div>
      <p id="invite-error" class="error" hidden></p>
      <div id="invite-box" hidden>
        <textarea id="invite-uri" class="mono" rows="3" readonly spellcheck="false"></textarea>
        <div class="row">
          <button id="btn-invite-copy" data-i18n="btnCopyUri"></button>
        </div>
        <p class="hint" data-i18n="inviteExpires"></p>
      </div>
      <ul id="sessions" class="approvals"></ul>
      <p id="no-sessions" class="muted" data-i18n="noSessions"></p>
    </section>

    <p class="hint" data-i18n="popupHint"></p>
  </main>

  <script src="popup.js"></script>
</body>
</html>
